name: Deploy Expo Web to GitHub Pages

on:
  push:
    branches: ["main", "Refactor_main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Hiwox_frontend_refactor-main/hiwox_wellness_app/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: Hiwox_frontend_refactor-main/hiwox_wellness_app
        run: npm ci

      - name: Build with Expo
        working-directory: Hiwox_frontend_refactor-main/hiwox_wellness_app
        run: npx expo export --platform web --output-dir dist

      - name: Prepare GitHub Pages artifact
        working-directory: Hiwox_frontend_refactor-main/hiwox_wellness_app
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Hiwox_frontend_refactor-main/hiwox_wellness_app/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
